services:
  db:
    image: postgres:17-alpine
    container_name: resort-db
    environment:
      POSTGRES_USER: resort_user
      POSTGRES_PASSWORD: resort_password
      POSTGRES_DB: resort_db
    ports:
      - "5432:5432"
    volumes:
      - resort_db_data:/var/lib/postgresql/data
    networks:
      - resort-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: resort-backend
    ports:
      - "5084:5084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5084
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=resort_db;Username=resort_user;Password=resort_password
    networks:
      - resort-network
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./apps/backend/Api
          action: rebuild

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: resort-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5084
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    networks:
      - resort-network
    depends_on:
      - backend
    develop:
      watch:
        - path: ./apps/web/src
          action: sync
          target: /app/apps/web/src
        - path: ./apps/web/public
          action: sync
          target: /app/apps/web/public

networks:
  resort-network:
    driver: bridge

volumes:
  resort_db_data:
